// La clé peut venir du lien court (/equipe/CLE), de #k=, de ?k=, ou de la mémoire du navigateur.
function getKey(){ var k = keyFrom(location.pathname) || keyFrom(location.hash) || keyFrom(location.search); if (k) { store(k); return k; } return stored(); }
function askKey(title, text){
  showState("🔒", title, text);
  var inp = h("input",{type:"text", id:"keyInput", placeholder:"Colle ici le lien qu'Awen t'a envoyé", autocomplete:"off", style:"width:100%;max-width:420px;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);margin:14px 0 10px;background:#fff"});
  var btn = h("button",{class:"btn main", type:"button", id:"keyBtn", text:"Ouvrir la fiche"});
  var err = h("p",{id:"keyErr", style:"color:var(--no);font-weight:600;min-height:1.4em;margin:6px 0 0"});
  function go(){ var k = keyFrom(inp.value); if (!k){ err.textContent = "Ce lien n'a pas la clé. Recopie-le en entier."; return; } store(k); try { history.replaceState(null, "", "/equipe.html"); } catch(e) {} load(); }
  btn.addEventListener("click", go); inp.addEventListener("keydown", function(e){ if (e.key === "Enter") go(); });
  $("app").querySelector(".state").appendChild(h("div",{},[inp, h("br"), btn, err]));
}
var current = null;

function showState(emoji, title, text){
  $("app").innerHTML = ""; $("tools").classList.add("hidden"); $("nav").classList.add("hidden"); $("facts").innerHTML = "";
  $("app").appendChild(h("div",{class:"state"},[h("div",{class:"big",text:emoji}),h("h2",{text:title}),h("p",{text:text})]));
}
function load(){
  var KEY = getKey();
  if (!KEY){ $("upd").textContent=""; askKey("Lien incomplet","Colle le lien équipe complet, une seule fois : ensuite cette page s\u2019ouvre toute seule sur ce téléphone."); return; }
  $("upd").textContent = "Chargement…";
  var ctrl = ("AbortController" in window) ? new AbortController() : null; var to = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 15000);
  fetch("/api/fiche?m=" + encodeURIComponent(SCHEMA.slug), {headers:{"X-Key":KEY}, cache:"no-store", signal: ctrl?ctrl.signal:undefined})
    .then(function(r){ return r.json().then(function(j){ return {status:r.status, j:j}; }); })
    .then(function(x){
      if (x.status === 401){ store(""); $("upd").textContent=""; askKey("Lien invalide","Ce lien ne marche pas. Colle le bon lien équipe envoyé par Awen."); return; }
      if (x.status !== 200) throw new Error("HTTP "+x.status);
      if (!x.j.fiche){ $("upd").textContent=""; showState("⏳", SCHEMA.model + " n'a pas encore envoyé sa fiche","Dès qu'elle clique sur Envoyer, tout apparaît ici. Clique sur Actualiser."); $("tools").classList.remove("hidden"); $("copyBtn").classList.add("hidden"); $("printBtn").classList.add("hidden"); return; }
      current = x.j.fiche; render(current);
    })
    .catch(function(){ $("upd").textContent=""; showState("📶","Impossible de charger","Vérifie ta connexion puis clique sur Actualiser."); $("tools").classList.remove("hidden"); })
    .then(function(){ clearTimeout(to); });
}
function animalsBlock(st){
  if ((st.f||{}).a_animaux === "Non") return h("div",{class:"val",text:"Pas d'animaux"});
  var list = (st.animals||[]).filter(function(a){ return a && (trim(a.esp)||trim(a.nom)||trim(a.age)||trim(a.info)); });
  if (!list.length) return null;
  return h("div",{class:"pets"}, list.map(function(a){
    var head = [trim(a.nom), trim(a.esp), trim(a.age) ? trim(a.age) + (/^\d+$/.test(trim(a.age)) ? " ans" : "") : ""].filter(Boolean).join(" · ");
    return h("div",{class:"pet"},[h("b",{text:"🐾 " + head}), trim(a.info) ? h("div",{class:"val",text:trim(a.info)}) : null]);
  }));
}
function limitsBlock(f, st){
  var L = {ok:["ok","OK"], avoir:["avoir","À voir"], non:["non","Non"]};
  return h("div",{class:"lims"}, f.items.map(function(it){ var v = L[(st.lim||{})[it]] || ["na","?"];
    return h("div",{class:"lim"},[h("span",{text:it}), h("span",{class:"pill "+v[0], text:v[1]})]); }));
}
function anecBlock(st){
  var list = (st.anec||[]).filter(function(a){ return a && trim(a.t); });
  if (!list.length) return null;
  return h("div",{class:"anec-list"}, list.map(function(a,i){
    return h("div",{class:"anec"},[h("div",{class:"anec-h"},[h("span",{class:"num",text:String(i+1)}), a.cat ? h("span",{class:"tag"+(a.cat==="Au lit"?" lit":""),text:a.cat}) : null]), h("div",{class:"val",text:trim(a.t)})]);
  }));
}
function render(doc){
  var st = doc.state || {}, F = st.f || {};
  $("upd").textContent = "Mise à jour le " + new Date(doc.savedAt).toLocaleString("fr-FR",{dateStyle:"long", timeStyle:"short"});
  var facts = $("facts"); facts.innerHTML = "";
  [["Prénom","prenom"],["Âge","age"],["Ville","ville"],["Signe","signe"],["Pseudo","pseudo"]].forEach(function(p){
    var v = trim(F[p[1]]); if (v) facts.appendChild(h("div",{class:"fact"},[h("b",{text:p[0]}), (p[1]==="age"? v+" ans" : v)]));
  });
  var app = $("app"); app.innerHTML = ""; var nav = $("navIn"); nav.innerHTML = "";
  SCHEMA.sections.forEach(function(s){
    var card = h("section",{class:"card", id:"s-"+s.id, style:"--tint:"+s.tint},[h("div",{class:"sec-head"},[h("div",{class:"sec-emoji",text:s.emoji}), h("h2",{class:"sec-title",text:s.title})])]);
    var filled = 0;
    s.fields.forEach(function(f){
      if (f.name === "a_animaux") return;
      var content = null;
      if (f.type === "animals") content = animalsBlock(st);
      else if (f.type === "limits") content = limitsBlock(f, st);
      else if (f.type === "anecdotes") content = anecBlock(st);
      else { var v = trim(F[f.name]); if (v) content = h("div",{class:"val",text:v}); }
      if (content) filled++;
      card.appendChild(h("div",{class:"row"},[h("div",{class:"lab",text: f.type==="anecdotes" ? (st.anec||[]).filter(function(a){return a&&trim(a.t);}).length + " anecdotes" : f.label}), content || h("div",{class:"empty",text:"Pas répondu"})]));
    });
    app.appendChild(card);
    nav.appendChild(h("a",{href:"#s-"+s.id,text:s.emoji+" "+s.title}));
  });
  $("tools").classList.remove("hidden"); $("copyBtn").classList.remove("hidden"); $("printBtn").classList.remove("hidden"); $("nav").classList.remove("hidden");
}
function copyText(txt){
  function fb(){ var t=document.createElement("textarea"); t.value=txt; t.style.position="fixed"; t.style.top="-1000px"; document.body.appendChild(t); t.select(); var ok=false; try{ ok=document.execCommand("copy"); }catch(e){} document.body.removeChild(t); return ok; }
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(txt).then(function(){return true;},function(){return fb();});
  return Promise.resolve(fb());
}
$("copyBtn").addEventListener("click", function(){ if(!current) return; copyText((current.payload||{}).fiche_complete || "").then(function(ok){ toast(ok ? "Fiche copiée ✓" : "Copie impossible"); }); });
$("reloadBtn").addEventListener("click", load);
$("printBtn").addEventListener("click", function(){ window.print(); });
window.addEventListener("hashchange", load);
window.__equipe = {load:load};
load();
})();
</script>
</body>
</html>
